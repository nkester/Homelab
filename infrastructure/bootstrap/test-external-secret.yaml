apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: test-secret
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gitlab-secret-store
  target:
    name: test-secret-sync
    creationPolicy: Owner
  data:
    - secretKey: my-test-key
      remoteRef:
        key: TEST_SECRET_VARIABLE
