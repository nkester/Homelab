apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gitlab-secret-store
spec:
  provider:
    gitlab:
      url: https://gitlab.com
      projectID: "nkester-personal-cloud%2Fhomelab"
      auth:
        SecretRef:
          accessToken:
            name: gitlab-secret-token
            key: token
            namespace: external-secrets
