apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner
  namespace: gitlab-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitlab-runner-role
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/attach", "pods/exec", "pods/log", "pods/status", "services", "secrets", "configmaps", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitlab-runner-binding
subjects:
  - kind: ServiceAccount
    name: gitlab-runner
    namespace: gitlab-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitlab-runner-role
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-runner-config
  namespace: gitlab-runner
data:
  config.toml: |
    concurrent = 4
    check_interval = 3

    [session_server]
      session_timeout = 1800

    [[runners]]
      name = "homelab-k8s-runner"
      url = "https://gitlab.com/"
      token = "${RUNNER_TOKEN}"
      executor = "kubernetes"
      environment = ["FF_KUBERNETES_HONOR_ENTRYPOINT=false"]
      [runners.custom_build_dir]
      [runners.cache]
        MaxUploadedArchiveSize = 0
      [runners.kubernetes]
        host = ""
        bearer_token_overwrite_allowed = false
        image = "ruby:3.1"
        namespace = "gitlab-runner"
        privileged = false
        allow_privilege_escalation = false
        service_account = "gitlab-runner"
        pull_policy = ["always", "if-not-present"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-runner
  namespace: gitlab-runner
  labels:
    app: gitlab-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab-runner
  template:
    metadata:
      labels:
        app: gitlab-runner
    spec:
      serviceAccountName: gitlab-runner
      containers:
        - name: gitlab-runner
          image: gitlab/gitlab-runner:alpine-v16.11.0
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              sed "s|\${RUNNER_TOKEN}|${RUNNER_TOKEN}|g" /config-template/config.toml > /etc/gitlab-runner/config.toml
              exec gitlab-runner run --working-directory=/home/gitlab-runner
          env:
            - name: CI_SERVER_URL
              value: "https://gitlab.com/"
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitlab-runner-secret
                  key: runner-registration-token
            - name: RUNNER_TAG_LIST
              value: "homelab-runner,vlan10"
            - name: RUNNER_EXECUTOR
              value: "kubernetes"
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: config-dir
              mountPath: /etc/gitlab-runner
            - name: init-volume
              mountPath: /home/gitlab-runner
      volumes:
        - name: config-template
          configMap:
            name: gitlab-runner-config
        - name: config-dir
          emptyDir: {}
        - name: init-volume
          emptyDir: {}
