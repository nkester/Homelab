apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: helloworld-go
  namespace: default
spec:
  template:
    metadata:
      annotations:
        # Explicitly bind KPA autoscaler class to prevent bootstrap webhook race conditions
        autoscaling.knative.dev/class: "kpa.autoscaling.knative.dev"
        # Scale to zero grace period configured for validation
        autoscaling.knative.dev/scale-to-zero-pod-retention-period: "15s"
        autoscaling.knative.dev/window: "15s"
    spec:
      containers:
        - image: gcr.io/knative-samples/helloworld-go
          env:
            - name: TARGET
              value: "ORSA Homelab"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
