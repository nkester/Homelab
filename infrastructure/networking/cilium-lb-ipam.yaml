apiVersion: "cilium.io/v2alpha1"
kind: CiliumLoadBalancerIPPool
metadata:
  name: "homelab-lb-pool"
  namespace: kube-system
spec:
  blocks:
    # Explicit non-overlapping range (10.10.10.17 - 10.10.10.25)
    # Prevents collision with ER605 VLAN 10 DHCP pool (10.10.10.30 - 10.10.10.99)
    - start: "10.10.10.17"
      stop: "10.10.10.25"
---
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: "homelab-l2-announcement"
  namespace: kube-system
spec:
  loadBalancerIPs: true
