apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-validation
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab
    platform.homelab/layer: storage
    platform.homelab/category: validation
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/nkester/homelab.git'
    targetRevision: argocd-deploy
    path: infrastructure/storage/longhorn-validation
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: storage-validation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
