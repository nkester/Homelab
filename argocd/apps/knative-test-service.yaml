apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: knative-test-service
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab
    platform.homelab/layer: serverless
    platform.homelab/category: test
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/nkester/homelab.git'
    targetRevision: argocd-deploy
    path: infrastructure/serverless/knative/test-service
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
